<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaCabl3Guy Banlist Hub</title>

<style>

body{
background:#050816;
color:cyan;
font-family:Arial,sans-serif;
padding:20px;
}

.logo-container{
text-align:center;
margin-bottom:20px;
}

.logo{
width:450px;
max-width:90%;
filter:
drop-shadow(0 0 15px cyan)
drop-shadow(0 0 25px lime);
transition:0.3s;
}

.logo:hover{
transform:scale(1.05);
}

h1,h2{
text-align:center;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin:20px 0;
}

input,
select{
padding:10px;
font-size:16px;
}

#results{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
margin-bottom:40px;
}

.card{
border:1px solid cyan;
padding:10px;
border-radius:10px;
text-align:center;
background:rgba(0,255,255,.05);
}

.card img{
width:100%;
border-radius:5px;
}

.forbidden{
color:red;
font-weight:bold;
}

.limited{
color:gold;
font-weight:bold;
}

.semi{
color:lime;
font-weight:bold;
}

textarea{
width:100%;
height:200px;
padding:10px;
margin-top:10px;
font-size:16px;
background:#081120;
color:white;
border:1px solid cyan;
}

button{
padding:10px 20px;
font-size:18px;
cursor:pointer;
margin-top:10px;
background:#081120;
color:cyan;
border:1px solid cyan;
}

button:hover{
background:#0d1d35;
}

#deckResults{
margin-top:20px;
font-size:18px;
}

hr{
margin:40px 0;
border-color:cyan;
}
  .navbar{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

margin:25px 0;
}

.navbar a{

color:cyan;
text-decoration:none;

padding:12px 20px;

border:1px solid cyan;

border-radius:10px;

background:rgba(0,255,255,.05);

transition:.3s;

font-weight:bold;
}

.navbar a:hover{

background:rgba(0,255,255,.15);

box-shadow:0 0 15px cyan;

transform:translateY(-2px);
}

  
</style>

</head>

<body>

<div class="logo-container">

<a href="https://martionmx2-ctrl.github.io/Yugioh-ws/">

<img
src="dacabl3guy-logo.png"
alt="DaCabl3Guy Logo"
class="logo">

</a>

<h1>🚫 Yu-Gi-Oh Banlist Hub 🚫</h1>

</div>

<nav class="navbar">

<a href="../index.html">🏠 Home</a>

<a href="../deck.html">🃏 Deck Builder</a>

<a href="index.html">🚫 Banlist Hub</a>

<a href="#deckInput">⚖️ Deck Checker</a>

</nav>
  
<div class="controls">

<input
type="text"
id="search"
placeholder="Search card..."

>

<select id="format">
<option value="ban_tcg">TCG</option>
<option value="ban_ocg">OCG</option>
<option value="ban_md">Master Duel</option>
</select>

<select id="status">
<option value="all">All</option>
<option value="Forbidden">Forbidden</option>
<option value="Limited">Limited</option>
<option value="Semi-Limited">Semi-Limited</option>
</select>

</div>

<div id="results"></div>

<hr>

<h2>🎴 Deck Legality Checker</h2>

<textarea
id="deckInput"
placeholder="Paste one card name per line..."
></textarea>

<br>

<button onclick="checkDeck()">
Check Deck
</button>

<div id="deckResults"></div>

<script>

let cards=[];

async function loadCards(){

const response =
await fetch(
"https://db.ygoprodeck.com/api/v7/cardinfo.php"
);

const data =
await response.json();

cards = data.data;

filterCards();
}

function filterCards(){

const search =
document
.getElementById("search")
.value
.toLowerCase();

const format =
document
.getElementById("format")
.value;

const status =
document
.getElementById("status")
.value;

const results =
document
.getElementById("results");

results.innerHTML="";

cards.forEach(card=>{

const ban =
card.banlist_info?.[format];

if(!ban) return;

if(
status !== "all" &&
ban !== status
){
return;
}

if(
!card.name
.toLowerCase()
.includes(search)
){
return;
}

let cls="";

if(ban==="Forbidden") cls="forbidden";
if(ban==="Limited") cls="limited";
if(ban==="Semi-Limited") cls="semi";

results.innerHTML += `

<div class="card">

<img src="${card.card_images[0].image_url_small}">

<h3>${card.name}</h3>

<div class="${cls}">
${ban}
</div>

</div>

`;

});

}

function checkDeck(){

const text =
document
.getElementById("deckInput")
.value;

const lines =
text
.split("\n")
.map(card=>card.trim())
.filter(card=>card);

const format =
document
.getElementById("format")
.value;

let output="";

lines.forEach(name=>{

const card =
cards.find(c=>
c.name.toLowerCase()===
name.toLowerCase()
);

if(!card){

output += `
<p>❓ ${name} (Not Found)</p>
`;

return;
}

const status =
card.banlist_info?.[format];

if(status==="Forbidden"){

output += `
<p style="color:red;">
❌ ${card.name} - Forbidden
</p>
`;

}
else if(status==="Limited"){

output += `
<p style="color:gold;">
⚠️ ${card.name} - Limited
</p>
`;

}
else if(status==="Semi-Limited"){

output += `
<p style="color:lime;">
🟢 ${card.name} - Semi-Limited
</p>
`;

}
else{

output += `
<p>
✅ ${card.name} - Legal
</p>
`;

}

});

document
.getElementById("deckResults")
.innerHTML = output;

}

document
.getElementById("search")
.addEventListener("input",filterCards);

document
.getElementById("format")
.addEventListener("change",filterCards);

document
.getElementById("status")
.addEventListener("change",filterCards);

loadCards();

</script>

</body>
</html>
