<!DOCTYPE html>

<html>
<head>
<title>Yu-Gi-Oh Banlist Hub</title>

<style>

body{
background:#050816;
color:cyan;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
text-align:center;
text-shadow:0 0 10px cyan;
}

#search{
width:100%;
max-width:500px;
padding:12px;
margin:20px auto;
display:block;
font-size:18px;
}

#results{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.card{
border:1px solid cyan;
border-radius:10px;
padding:10px;
text-align:center;
background:rgba(0,255,255,.05);
}

.card img{
width:100%;
}

.status{
font-weight:bold;
font-size:18px;
}

</style>

</head>

<body>

<h1>🚫 Yu-Gi-Oh Banlist Hub 🚫</h1>

<input
id="search"
placeholder="Search card name..."

>

<div id="results"></div>

<script>

let cards=[];

async function loadCards(){

const response=
await fetch(
"https://db.ygoprodeck.com/api/v7/cardinfo.php"
);

const data=
await response.json();

cards=
data.data.filter(
c=>c.banlist_info?.ban_tcg
);

display(cards);
}

function display(list){

const results=
document.getElementById("results");

results.innerHTML="";

list.forEach(card=>{

results.innerHTML+=`

<div class="card">

<img src="${card.card_images[0].image_url_small}">

<h3>${card.name}</h3>

<div class="status">

${card.banlist_info.ban_tcg}

</div>

</div>

`;

});

}

document
.getElementById("search")
.addEventListener("input",e=>{

const term=
e.target.value.toLowerCase();

display(

cards.filter(card=>

card.name
.toLowerCase()
.includes(term)

)

);

});

loadCards();

</script>

</body>
</html>
