<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yu-Gi-Oh Banlist Hub</title>

<style>

body{
background:#050816;
color:cyan;
font-family:Arial,sans-serif;
padding:20px;
}

h1{
text-align:center;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin:20px 0;
}

input,
select{
padding:10px;
font-size:16px;
}

#results{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.card{
border:1px solid cyan;
padding:10px;
border-radius:10px;
text-align:center;
background:rgba(0,255,255,.05);
}

.card img{
width:100%;
}

.forbidden{
color:red;
font-weight:bold;
}

.limited{
color:gold;
font-weight:bold;
}

.semi{
color:lime;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🚫 Yu-Gi-Oh Banlist Hub 🚫</h1>

<div class="controls">

<input
type="text"
id="search"
placeholder="Search card..."

>

<select id="format">
<option value="ban_tcg">TCG</option>
<option value="ban_ocg">OCG</option>
<option value="ban_md">Master Duel</option>
</select>

<select id="status">
<option value="all">All</option>
<option value="Forbidden">Forbidden</option>
<option value="Limited">Limited</option>
<option value="Semi-Limited">Semi-Limited</option>
</select>

</div>

<div id="results"></div>

<script>

let cards=[];

async function loadCards(){

const response=
await fetch(
"https://db.ygoprodeck.com/api/v7/cardinfo.php"
);

const data=
await response.json();

cards=data.data;

filterCards();
}

function filterCards(){

const search=
document
.getElementById("search")
.value
.toLowerCase();

const format=
document
.getElementById("format")
.value;

const status=
document
.getElementById("status")
.value;

const results=
document
.getElementById("results");

results.innerHTML="";

cards.forEach(card=>{

const ban=
card.banlist_info?.[format];

if(!ban) return;

if(
status!=="all" &&
ban!==status
){
return;
}

if(
!card.name
.toLowerCase()
.includes(search)
){
return;
}

let cls="";

if(ban==="Forbidden")
cls="forbidden";

if(ban==="Limited")
cls="limited";

if(ban==="Semi-Limited")
cls="semi";

results.innerHTML+=`

<div class="card">

<img src="${card.card_images[0].image_url_small}">

<h3>${card.name}</h3>

<div class="${cls}">
${ban}
</div>

</div>

`;

});

}

document
.getElementById("search")
.addEventListener("input",filterCards);

document
.getElementById("format")
.addEventListener("change",filterCards);

document
.getElementById("status")
.addEventListener("change",filterCards);

loadCards();

</script>

</body>
</html>
